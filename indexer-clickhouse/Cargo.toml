[package]
name = "near-defuse-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "near-defuse-indexer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aws-config = { version = "1.1.3", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.13.0"
blocksapi.workspace = true
clap.workspace = true
clickhouse = { version = "0.13.2", features = ["rustls-tls", "inserter"] }
dotenv.workspace = true
futures.workspace = true
indexer-common.workspace = true
# rustls: the default native-tls links the build image's libssl.so.1.1, which
# every indexer VM then needs installed (data-ops DAT-274). Upstream Lake is
# deprecated and won't release a TLS switch, so we pin our fork: 0.7.x plus a
# `rustls-tls` feature. Lake bumps (near-indexer-primitives) now happen there.
near-lake-framework = { git = "https://github.com/khorolets/near-lake-framework-rs", branch = "fix/reqwest-rustls", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
indexer-primitives = { workspace = true, features = ["clickhouse"] }
tokio.workspace = true
tokio-retry.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
